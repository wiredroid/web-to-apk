name: Validate TruthPoster R6.2 Fixed Dependencies
on:
  push:
    branches: [truthposter-r6-2-fixed-dependency-validated]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependency_audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned advisory scanner
        run: python -m pip install --disable-pip-version-check pip-audit==2.10.1
      - name: Audit exact fixed runtime list
        run: |
          set +e
          python -m pip_audit -r truthposter-r6-2-fixed-requirements.lock --no-deps --format json --output TruthPoster_R6_2_PIP_AUDIT.json
          rc=$?
          echo "$rc" > TruthPoster_R6_2_PIP_AUDIT.exit-code
          python - <<'PY'
          import json
          from pathlib import Path
          raw=json.loads(Path('TruthPoster_R6_2_PIP_AUDIT.json').read_text())
          deps=raw.get('dependencies', raw if isinstance(raw,list) else [])
          vulns=[]
          for dep in deps:
              for item in dep.get('vulns', []):
                  vulns.append({'package':dep.get('name'),'version':dep.get('version'),**item})
          summary={'dependency_count':len(deps),'vulnerability_count':len(vulns),'vulnerabilities':vulns}
          Path('TruthPoster_R6_2_PIP_AUDIT_SUMMARY.json').write_text(json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary,indent=2))
          PY
          exit 0
      - name: Download fixed public wheels
        run: python -m pip download --only-binary=:all: --dest wheelhouse idna==3.15 pillow==12.3.0 soupsieve==2.8.4
      - name: Hash fixed wheels
        run: sha256sum wheelhouse/* | tee TruthPoster_R6_2_FIXED_WHEELS.sha256
      - name: Upload advisory result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TruthPoster-R6-2-Dependency-Audit
          path: |
            TruthPoster_R6_2_PIP_AUDIT.json
            TruthPoster_R6_2_PIP_AUDIT_SUMMARY.json
            TruthPoster_R6_2_PIP_AUDIT.exit-code
          if-no-files-found: error
      - name: Upload fixed wheels
        uses: actions/upload-artifact@v4
        with:
          name: TruthPoster-R6-2-Fixed-Wheels
          path: |
            wheelhouse/*
            TruthPoster_R6_2_FIXED_WHEELS.sha256
          if-no-files-found: error
      - name: Enforce zero known vulnerabilities
        run: test "$(cat TruthPoster_R6_2_PIP_AUDIT.exit-code)" = "0"
