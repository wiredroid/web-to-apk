name: Build TruthPoster R6.2 Control Centre APK
on:
  push:
    branches: [truthposter-r6-control-centre-apk-build]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Restore audited Android wrapper source
        run: |
          set -euxo pipefail
          base64 -d truthposter-r6-android.tar.gz.b64 > truthposter-r6-android.tar.gz
          rm -rf truthposter-r6-android
          mkdir -p truthposter-r6-android
          tar -xzf truthposter-r6-android.tar.gz --strip-components=1 -C truthposter-r6-android
          python3 -c "from pathlib import Path; import re; p=Path('truthposter-r6-android/app/build.gradle'); s=p.read_text(); s,n1=re.subn(r'versionCode\\s+\\d+','versionCode 60200',s,count=1); s,n2=re.subn(r\"versionName\\s+'[^']+'\",\"versionName '6.2.0'\",s,count=1); assert (n1,n2)==(1,1),(n1,n2); p.write_text(s)"
          grep -E "version(Code|Name)" truthposter-r6-android/app/build.gradle
          grep -q "versionCode 60200" truthposter-r6-android/app/build.gradle
          grep -q "versionName '6.2.0'" truthposter-r6-android/app/build.gradle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: yes | sdkmanager --licenses >/dev/null && sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK and preserve diagnostics
        working-directory: truthposter-r6-android
        run: |
          set +e
          gradle --no-daemon :app:assembleDebug > gradle-build.log 2>&1
          echo $? > build-exit-code.txt
          tail -n 160 gradle-build.log
          exit 0
      - name: Upload Gradle diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TruthPoster-R6-2-Gradle-Diagnostics
          path: |
            truthposter-r6-android/gradle-build.log
            truthposter-r6-android/build-exit-code.txt
          if-no-files-found: error
      - name: Verify and hash APK
        run: |
          test "$(cat truthposter-r6-android/build-exit-code.txt)" = "0"
          test -s truthposter-r6-android/app/build/outputs/apk/debug/app-debug.apk
          cp truthposter-r6-android/app/build/outputs/apk/debug/app-debug.apk TruthPoster_Control_Centre_R6_2_debug.apk
          sha256sum TruthPoster_Control_Centre_R6_2_debug.apk | tee TruthPoster_Control_Centre_R6_2_debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: TruthPoster-Control-Centre-R6-2-APK
          path: |
            TruthPoster_Control_Centre_R6_2_debug.apk
            TruthPoster_Control_Centre_R6_2_debug.apk.sha256
          if-no-files-found: error
