name: TruthPoster R6.2 Dependency Advisory Audit
on:
  push:
    branches: [truthposter-r6-2-fixed-dependency-audit-default-pr]
    paths-ignore: [truthposter-r6-2-fixed-audit-output/**]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: truthposter-r6-2-fixed-dependency-audit-default-pr
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned auditor
        run: python -m pip install --disable-pip-version-check pip-audit==2.10.1
      - name: Audit exact pinned runtime list
        run: |
          set +e
          python -m pip_audit -r truthposter-r6-2-requirements.lock --no-deps --format json --output TruthPoster_R6_2_PIP_AUDIT.json
          echo $? > TruthPoster_R6_2_PIP_AUDIT.exit-code
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('TruthPoster_R6_2_PIP_AUDIT.json')
          data=json.loads(p.read_text()) if p.exists() else {}
          deps=data.get('dependencies', data if isinstance(data,list) else [])
          vulnerabilities=[]
          for dep in deps:
              for vuln in dep.get('vulns', []):
                  vulnerabilities.append({'package':dep.get('name'),'version':dep.get('version'),**vuln})
          summary={'dependency_count':len(deps),'vulnerability_count':len(vulnerabilities),'vulnerabilities':vulnerabilities}
          Path('TruthPoster_R6_2_PIP_AUDIT_SUMMARY.json').write_text(json.dumps(summary,indent=2)+'\n')
          print(json.dumps(summary,indent=2))
          PY
      - name: Download advisory-fixed wheels for offline validation
        run: python -m pip download --only-binary=:all: --dest wheelhouse idna==3.15 pillow==12.3.0 soupsieve==2.8.4
      - name: Publish isolated audit output to temporary branch
        run: |
          rm -rf truthposter-r6-2-fixed-audit-output
          mkdir -p truthposter-r6-2-fixed-audit-output/wheels
          cp TruthPoster_R6_2_PIP_AUDIT.json TruthPoster_R6_2_PIP_AUDIT_SUMMARY.json TruthPoster_R6_2_PIP_AUDIT.exit-code truthposter-r6-2-fixed-audit-output/
          cp wheelhouse/* truthposter-r6-2-fixed-audit-output/wheels/
          sha256sum truthposter-r6-2-fixed-audit-output/wheels/* > truthposter-r6-2-fixed-audit-output/WHEEL_SHA256SUMS
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add truthposter-r6-2-fixed-audit-output
          git commit -m '[skip ci] Store TruthPoster R6.2 fixed dependency audit output'
          git push origin HEAD:truthposter-r6-2-fixed-dependency-audit-default-pr
      - name: Enforce no known vulnerabilities
        run: test "$(cat TruthPoster_R6_2_PIP_AUDIT.exit-code)" = "0"
