name: Build TruthPoster R6.2.2 Control Centre APK
on:
  push:
    branches: [truthposter-r622-control-centre-apk-build]
  pull_request:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact Android source and preserve diagnostics
        run: |
          set +e
          {
            wc -c truthposter-r622-android.tar.gz.b64
            base64 -d truthposter-r622-android.tar.gz.b64 > truthposter-r622-android.tar.gz
            echo decode_rc=$?
            sha256sum truthposter-r622-android.tar.gz || true
            mkdir -p truthposter-r622-android
            tar -tzf truthposter-r622-android.tar.gz | head -40
            tar -xzf truthposter-r622-android.tar.gz --strip-components=1 -C truthposter-r622-android
            echo extract_rc=$?
            find truthposter-r622-android -maxdepth 3 -type f -print | sort
          } > restore-diagnostics.txt 2>&1
          cat restore-diagnostics.txt
          test -f truthposter-r622-android/settings.gradle
      - name: Upload restore diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TruthPoster-R6-2-2-Restore-Diagnostics
          path: restore-diagnostics.txt
          if-no-files-found: error
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: yes | sdkmanager --licenses >/dev/null && sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build debug APK
        working-directory: truthposter-r622-android
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify identity and hash APK
        run: |
          test -s truthposter-r622-android/app/build/outputs/apk/debug/app-debug.apk
          cp truthposter-r622-android/app/build/outputs/apk/debug/app-debug.apk TruthPoster_Control_Centre_R6_2_2_debug.apk
          sha256sum TruthPoster_Control_Centre_R6_2_2_debug.apk | tee TruthPoster_Control_Centre_R6_2_2_debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: TruthPoster-Control-Centre-R6-2-2-APK
          path: |
            TruthPoster_Control_Centre_R6_2_2_debug.apk
            TruthPoster_Control_Centre_R6_2_2_debug.apk.sha256
          if-no-files-found: error
